<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores SVG here and falls back to a screenshot of the page, so the
         touch icon has to be a raster file at the size Apple asks for. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7F9FC" />

    <title>IES Global Foundation — Keeping IES strong beyond graduation</title>
    <meta
      name="description"
      content="IES Global Foundation connects IES Korea and IES United States and brings together founders and former leaders to support the students who lead next."
    />
    <link rel="canonical" href="__SITE_ORIGIN__/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="IES Global Foundation" />
    <meta property="og:title" content="IES Global Foundation — Keeping IES strong beyond graduation" />
    <meta
      property="og:description"
      content="IES Global Foundation connects IES Korea and IES United States and brings together founders and former leaders to support the students who lead next."
    />
    <meta property="og:url" content="__SITE_ORIGIN__/" />
    <!--
      PNG, not SVG: no major platform (Facebook, X, LinkedIn, Slack, iMessage)
      renders an SVG preview — they drop the card image entirely. Declaring the
      dimensions lets a scraper lay the card out on first fetch instead of
      waiting until it has downloaded the file. public/og-image.svg remains the
      editable source; regenerate the PNG from it after any change.
    -->
    <meta property="og:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="IES Global Foundation"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="IES Global Foundation — Keeping IES strong beyond graduation" />
    <meta
      name="twitter:description"
      content="IES Global Foundation connects IES Korea and IES United States and brings together founders and former leaders to support the students who lead next."
    />
    <meta name="twitter:image" content="__SITE_ORIGIN__/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="IES Global Foundation"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded without blocking the first paint: the stylesheet is fetched at high
      priority via preload, then swapped in by flipping `media`. `display=swap`
      already governs the font itself, so the only change is that text now paints
      in the fallback immediately instead of waiting on this round trip.
    -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Inter:wght@400;500;600&display=swap"
      />
    </noscript>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "IES Global Foundation",
        "alternateName": ["IES", "Interscholastic Ethics Society", "세계청소년사회윤리재단"],
        "url": "__SITE_ORIGIN__/",
        "foundingDate": "2023-04-20",
        "foundingLocation": "Seoul, South Korea",
        "founder": [
          { "@type": "Person", "name": "Jaesuh Joshua Shin" },
          { "@type": "Person", "name": "Joseph Hahmmin Kang" }
        ],
                "description": "IES Global Foundation connects IES Korea and IES United States and brings together founders and former leaders to support the students who lead next.",
        "email": "theiesociety@gmail.com",
        "sameAs": [
          "https://ie-society.com/",
          "https://iesusa.space/"
        ],
        "subOrganization": [
          { "@type": "Organization", "name": "IES Korea", "url": "https://ie-society.com/" },
          { "@type": "Organization", "name": "IES United States", "url": "https://iesusa.space/" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
